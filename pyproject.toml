[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "memway"
version = "0.49.1"
description = "A coordinate system for code: stable entity identity through refactors, lineage, and a self-auditing memory layer for coding agents. A cache answers what the code is; the map knows what we've learned about it."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "William Hurley" }]
keywords = [
    "mcp", "agents", "code-intelligence", "knowledge", "lineage",
    "static-analysis", "claude-code", "codebase-memory",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development",
    "Operating System :: OS Independent",
]
# Zero runtime dependencies - stdlib only, by design.
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]
# Python parsing is stdlib-only. Other languages use tree-sitter
# grammars, installed via:  pip install memway[languages]
languages = [
    "tree-sitter==0.26.0",
    "tree-sitter-javascript==0.25.0",
    "tree-sitter-typescript==0.23.2",
    "tree-sitter-go==0.25.0",
    "tree-sitter-java==0.23.5",
]

[project.scripts]
memway = "memway.cli:main"

[tool.setuptools]
packages = ["memway"]

[tool.setuptools.package-data]
memway = ["lens_template.html"]
