[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "memway"
version = "0.61.2"
description = "A coordinate system for code: stable entity identity through refactors, lineage, and a self-auditing memory layer for coding agents. A cache answers what the code is; the map knows what we've learned about it."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "William Hurley", email = "support@memway.io" }]
keywords = [
    "mcp", "agents", "code-intelligence", "knowledge", "lineage",
    "static-analysis", "claude-code", "codebase-memory",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development",
    "Operating System :: OS Independent",
]
# Zero runtime dependencies - stdlib only, by design.
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]
# Python parsing is stdlib-only. Other languages use tree-sitter
# grammars, installed via:  pip install memway[languages]
languages = [
    "tree-sitter==0.26.0",
    "tree-sitter-javascript==0.25.0",
    "tree-sitter-typescript==0.23.2",
    "tree-sitter-go==0.25.0",
    "tree-sitter-java==0.23.5",
]

[project.scripts]
memway = "memway.cli:main"

[tool.setuptools]
packages = ["memway"]

[tool.setuptools.package-data]
memway = ["lens_template.html", "viz_template.html",
          "vendor/d3.min.js", "vendor/d3.LICENSE"]

[tool.pytest.ini_options]
markers = [
    "slow: builds real venvs (editable + wheel installs). Kept in the default\n    run on purpose - the editable --version bug survived for weeks precisely\n    because the only install test used a wheel.",
    "network: clones real repositories at pinned shas. Deselected by default\n    (see addopts) because a normal run must work offline; run at release with\n    `pytest -m network`. These are the corpus floors - fixtures encode what\n    you thought of, corpora catch what you didn't, so both layers exist.",
    "release: gates that compare a DERIVED artifact against the committed map.\n    Deselected by default because .coord moves on nearly every commit, so\n    running these per-save would keep the suite red for ordinary work and\n    train everyone to ignore it. Run at release: `pytest -m release`.",
]
# Offline by default. The corpus floors are a RELEASE gate, not a save gate.
addopts = "-m 'not network and not release'"
